<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Call the Wizard - Magic Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* PLEIN ÉCRAN TOTAL SANS BORDURES */
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* LE CONTENEUR PREND 100% DE L'ÉCRAN DISPONIBLE */
    .phone-container {
      width: 100%;
      height: 100%;
      background-image: url('fond-iphone.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* AFFICHAGE DE LA VERSION (EN HAUT À GAUCHE) */
    .app-version {
      position: absolute;
      top: 52px;
      left: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: bold;
      z-index: 999;
      font-family: monospace;
    }

    /* ZONE D'AFFICHAGE DES CHIFFRES SECRET DE SÉLECTION (EN HAUT À DROITE) */
    .magic-indicator {
      position: absolute;
      top: 52px;
      right: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: bold;
      z-index: 1001;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
      display: none; /* Apparaît uniquement pendant l'appel */
    }

    /* ZONE CLIQUABLE INVISIBLE (SUR LE BOUTON APPEL DU FOND) */
    .invisible-call-trigger {
      position: absolute;
      bottom: 22%; /* Aligné sur la zone basse du téléphone */
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0);
      z-index: 950;
    }

    /* CALQUE DE L'ÉCRAN D'APPEL EN TRANSPARENCE FLUIDE */
    #layer-calling {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 28, 60, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      display: none;
    }

    .calling-status {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 5px;
    }

    .calling-name {
      color: #ffffff;
      font-size: 38px;
      font-weight: 500;
      margin-bottom: 40px;
    }

    /* GRILLE INTERACTIVE DU TOUR (BOUTONS DISCRETS OU ACTIONS) */
    .calling-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 85%;
      margin-top: auto;
      margin-bottom: 40px;
    }

    .call-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 13px;
    }

    .circle-btn {
      width: 65px;
      height: 65px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .btn-hangup {
      background-color: #ff3b30;
    }
  </style>
</head>
<body>

  <div class="phone-container">

    <!-- Version mise à jour à la minute près -->
    <div class="app-version" id="version-lbl">v1.0.0000</div>

    <!-- Compteur secret pour le magicien en haut à droite -->
    <div class="magic-indicator" id="magic-box">Valeur : --</div>

    <!-- Zone pour lancer l'appel depuis la photo de fond -->
    <div class="invisible-call-trigger" onclick="lancerAppelWizard()"></div>

    <!-- INTERFACE ÉCRAN D'APPEL -->
    <div id="layer-calling">
      <div class="calling-status" id="call-duration">Appel en cours...</div>
      <div class="calling-name">Nathalie</div>
      
      <div class="calling-grid">
        <!-- Cliquer sur silence ou clavier va intercepter discrètement la valeur / enseigne -->
        <div class="call-btn-container" onclick="selectionnerValeur()"><button class="circle-btn">🔇</button><span>silence</span></div>
        <div class="call-btn-container" onclick="selectionnerEnseigne()"><button class="circle-btn">⌨️</button><span>clavier</span></div>
        <div class="call-btn-container"><button class="circle-btn">🔊</button><span>haut-parleur</span></div>
        <div class="call-btn-container"><button class="circle-btn">➕</button><span>nouvel appel</span></div>
        <div class="call-btn-container"><button class="circle-btn">📹</button><span>FaceTime</span></div>
        <div class="call-btn-container"><button class="circle-btn">👤</button><span>contacts</span></div>
      </div>

      <!-- Bouton rouge Raccrocher -->
      <div style="margin-bottom: 60px;" onclick="raccrocherAppel()">
        <button class="circle-btn btn-hangup">🔴</button>
      </div>
    </div>

  </div>

  <script>
    // Configuration du tour de magie
    const valeursCartes = ["As", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Valet", "Dame", "Roi"];
    const enseignesCartes = ["Pique", "Cœur", "Trèfle", "Carreau"];
    
    let indexValeur = 0;
    let indexEnseigne = 0;
    let etapeTour = 0; // 0 = choix valeur, 1 = choix enseigne, 2 = terminé
    let intervalleMagic = null;

    // Mise à jour de la version automatique (Horodatage)
    function calculerVersionMinutes() {
      let derniereModif = new Date(document.lastModified);
      let jour = derniereModif.getDate();
      let heures = derniereModif.getHours();
      let minutes = derniereModif.getMinutes();

      if (jour < 10) jour = '0' + jour;
      if (heures < 10) heures = '0' + heures;
      if (minutes < 10) minutes = '0' + minutes;

      document.getElementById('version-lbl').innerText = "v1." + jour + "." + heures + minutes;
    }

    // Début du tour lors de l'appel
    function lancerAppelWizard() {
      document.getElementById('layer-calling').style.display = 'flex';
      document.getElementById('magic-box').style.display = 'block';
      
      etapeTour = 0;
      indexValeur = 0;
      indexEnseigne = 0;
      
      // La première série de chiffres défile discrètement en haut à droite toutes les 1.5 secondes
      intervalleMagic = setInterval(function() {
        if (etapeTour === 0) {
          document.getElementById('magic-box').innerText = "Carte : " + valeursCartes[indexValeur];
          indexValeur = (indexValeur + 1) % valeursCartes.length;
        } else if (etapeTour === 1) {
          document.getElementById('magic-box').innerText = "Enseigne : " + enseignesCartes[indexEnseigne];
          indexEnseigne = (indexEnseigne + 1) % enseignesCartes.length;
        }
      }, 1500);
    }

    // Validation secrète de la Valeur (ex: en appuyant sur le premier bouton ou à l'écoute)
    function selectionnerValeur() {
      if (etapeTour === 0) {
        // Bloque la valeur précédente sélectionnée par le défilement
        let valeurChoisie = valeursCartes[(indexValeur === 0 ? valeursCartes.length : indexValeur) - 1];
        etapeTour = 1; // Passe à la série des 4 enseignes
      }
    }

    // Validation secrète de l'Enseigne (Pique, Coeur, Trèfle, Carreau)
    function selectionnerEnseigne() {
      if (etapeTour === 1) {
        let valeurFinale = valeursCartes[(indexValeur === 0 ? valeursCartes.length : indexValeur) - 1];
        let enseigneFinale = enseignesCartes[(indexEnseigne === 0 ? enseignesCartes.length : indexEnseigne) - 1];
        
        etapeTour = 2;
        clearInterval(intervalleMagic);
        document.getElementById('magic-box').innerText = "Prêt !";

        // Déclenche le haut-parleur vocal (Synthèse vocale native)
        annoncerResultatHautParleur(valeurFinale, enseigneFinale);
      }
    }

    // Fonction de voix artificielle (Text-to-Speech)
    function annoncerResultatHautParleur(valeur, enseigne) {
      if ('speechSynthesis' in window) {
        let messageTexte = "La carte choisie est le " + valeur + " de " + enseigne;
        let pparle = new SpeechSynthesisUtterance(messageTexte);
        pparle.lang = 'fr-CA'; // Accent québécois / canadien français
        pparle.rate = 0.9;     // Vitesse naturelle de l'assistant
        window.speechSynthesis.speak(pparle);
      } else {
        alert("La carte est le " + valeur + " de " + enseigne);
      }
    }

    function raccordementManuelVocal(v, e) {
       // Permet de tester directement la voix si nécessaire
       annoncerResultatHautParleur(v, e);
    }

    function raccrocherAppel() {
      clearInterval(intervalleMagic);
      window.speechSynthesis.cancel(); // Coupe le son si en cours
      document.getElementById('layer-calling').style.display = 'none';
      document.getElementById('magic-box').style.display = 'none';
    }

    window.onload = calculerVersionMinutes;
  </script>

</body>
</html>
