<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call the Wizard - Simulateur iOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* =========================================
       TÉLÉPHONE
       ========================================= */

    .phone-container {
      width: 375px;
      height: 812px;

      /* PHOTO FOND IPHONE */
      background-image: url("fond-iphone.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      position: relative;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* =========================================
       NUMÉRO DE VERSION
       ========================================= */

    .app-version {
      position: absolute;
      top: 52px;
      left: 20px;

      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: bold;

      z-index: 999;

      background-color: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* =========================================
       ZONE INVISIBLE DU BOUTON APPEL
       ========================================= */

    .invisible-call-trigger {
      position: absolute;

      top: 605px;
      left: 112px;

      width: 55px;
      height: 55px;

      border-radius: 50%;
      cursor: pointer;

      background-color: rgba(255, 255, 255, 0);
    }

    /* Petit effet seulement pendant les tests */
    .invisible-call-trigger:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* =========================================
       ÉCRAN D'APPEL
       ========================================= */

    #screen-calling {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: linear-gradient(
        to bottom,
        #293d6d 0%,
        #152042 100%
      );

      z-index: 1000;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 60px;
    }

    .calling-status {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 5px;
    }

    .calling-name {
      color: #ffffff;
      font-size: 36px;
      font-weight: 500;
      margin-bottom: 40px;
    }

    /* =========================================
       BOUTONS DE L'APPEL
       ========================================= */

    .calling-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 30px;

      width: 80%;

      margin-top: auto;
      margin-bottom: 60px;
    }

    .call-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 8px;

      color: #ffffff;
      font-size: 12px;
    }

    .circle-btn {
      width: 55px;
      height: 55px;

      background-color: rgba(255, 255, 255, 0.2);

      border-radius: 50%;
      border: none;

      color: white;
      font-size: 20px;

      cursor: pointer;
    }

    .btn-hangup {
      background-color: #ff3b30;
    }

  </style>
</head>

<body>

  <!-- =========================================
       TÉLÉPHONE
       ========================================= -->

  <div class="phone-container">

    <!-- ÉCRAN PRINCIPAL -->
    <div id="screen-contact-view">

      <!-- Version -->
      <div class="app-version">
        v1.4.2
      </div>

      <!--
        ZONE INVISIBLE AU-DESSUS
        DU BOUTON TÉLÉPHONE
      -->
      <div
        class="invisible-call-trigger"
        onclick="lancerAppelWizard()">
      </div>

    </div>


    <!-- =========================================
         ÉCRAN D'APPEL
         ========================================= -->

    <div
      id="screen-calling"
      style="display: none;">

      <div class="calling-status">
        Appel cellulaire en cours...
      </div>

      <div class="calling-name">
        Nathalie
      </div>


      <!-- BOUTONS -->

      <div class="calling-grid">

        <div class="call-btn-container">
          <button class="circle-btn">🔇</button>
          <span>silence</span>
        </div>

        <div class="call-btn-container">
          <button class="circle-btn">⌨️</button>
          <span>clavier</span>
        </div>

        <div class="call-btn-container">
          <button class="circle-btn">🔊</button>
          <span>haut-parleur</span>
        </div>

        <div class="call-btn-container">
          <button class="circle-btn">➕</button>
          <span>nouvel appel</span>
        </div>

        <div class="call-btn-container">
          <button class="circle-btn">📹</button>
          <span>FaceTime</span>
        </div>

        <div class="call-btn-container">
          <button class="circle-btn">👤</button>
          <span>contacts</span>
        </div>

      </div>


      <!-- BOUTON RACCROCHER -->

      <div
        style="margin-bottom: 80px;"
        onclick="raccrocherAppel()">

        <button class="circle-btn btn-hangup">
          🔴
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    function lancerAppelWizard() {

      document.getElementById(
        'screen-contact-view'
      ).style.display = 'none';

      document.getElementById(
        'screen-calling'
      ).style.display = 'flex';

    }


    function raccrocherAppel() {

      document.getElementById(
        'screen-calling'
      ).style.display = 'none';

      document.getElementById(
        'screen-contact-view'
      ).style.display = 'block';

    }

  </script>

</body>
</html>
