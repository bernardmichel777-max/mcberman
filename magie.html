<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Balises Apple pour masquer l'interface de Safari une fois ajouté à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Téléphone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; overflow: hidden; }
        
        .phone-screen {
            height: 100%; width: 100%; max-width: 450px; margin: 0 auto;
            background: linear-gradient(to bottom, #605ee5 0%, #4b4bc9 40%, #3538ad 100%);
            color: white; display: flex; flex-direction: column; justify-content: space-between;
            padding: 60px 30px 50px 30px; position: relative;
        }

        .status-bar { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; padding: 0 10px; margin-bottom: 20px; }
        .call-info { text-align: center; margin-top: 20px; }
        .contact-name { font-size: 42px; font-weight: 400; margin-bottom: 8px; letter-spacing: 0.5px; }
        .call-status { font-size: 14px; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); letter-spacing: 2px; }

        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 20px; margin: auto 0; padding: 0 10px; }
        .btn-action { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; color: white; }
        .icon-circle { width: 68px; height: 68px; background-color: rgba(255, 255, 255, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 28px; }
        .btn-action:active .icon-circle { background-color: rgba(255, 255, 255, 0.4); }
        .btn-label { font-size: 13px; color: rgba(255, 255, 255, 0.9); }

        .bottom-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; margin-top: auto; }
        .btn-hangup { width: 72px; height: 72px; background-color: #ff3b30; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; font-size: 32px; color: white; transform: rotate(135deg); margin: 0 auto; }
        .bottom-side-icon { font-size: 24px; color: rgba(255, 255, 255, 0.8); width: 40px; text-align: center; }

        .ios-haptic-trigger { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <input type="checkbox" class="ios-haptic-trigger" id="hapticSwitch">

    <div class="phone-screen" id="mainScreen">
        <div class="status-bar">
            <div>12:35 PM</div>
            <div>📶 🔋 97%</div>
        </div>

        <div class="call-info">
            <div class="contact-name">Sister</div>
            <div class="call-status" id="statutAppel">CALLING..</div>
        </div>

        <div class="actions-grid">
            <div class="btn-action">
                <div class="icon-circle">👤</div>
                <div class="btn-label">Contact</div>
            </div>
            <div class="btn-action" id="addCallBtn" onclick="demarrerTour()">
                <div class="icon-circle" style="background-color: rgba(255,255,255,0.3);">➕</div>
                <div class="btn-label" style="font-weight: bold;">Add Call</div>
            </div>
            <div class="btn-action">
                <div class="icon-circle">🎙️</div>
                <div class="btn-label">Mute</div>
            </div>
            <div class="btn-action">
                <div class="icon-circle">⏸️</div>
                <div class="btn-label">Hold</div>
            </div>
            <div class="btn-action">
                <div class="icon-circle">📹</div>
                <div class="btn-label">Video Call</div>
            </div>
            <div class="btn-action">
                <div class="icon-circle">⏺️</div>
                <div class="btn-label">Record</div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="bottom-side-icon">🔊</div>
            <button class="btn-hangup">📞</button>
            <div class="bottom-side-icon">⣿</div>
        </div>
    </div>

    <script>
        const SEUIL_BRUIT = 0.06; 
        const valeurs = ["As", "Deux", "Trois", "Quatre", "Cinq", "Six", "Sept", "Huit", "Neuf", "Dix", "Valet", "Dame", "Roi"];
        const familles = {"1": "Pique", "2": "Cœur", "3": "Trèfle", "4": "Carreau"};

        let valeurChoisie = "";
        let familleChoisie = "";
        let audioContext, analyser, dataArray;
        let etape = 0; 
        let intervaleVibration;
        let prenomSpectateur = "mon cher ami"; 

        // Récupération automatique et discrète du prénom sur le serveur
        async function verifierFichierPrenom() {
            try {
                let reponse = await fetch('spect.txt?t=' + new Date().getTime()); // Évite les problèmes de mémoire cache
                if (reponse.ok) {
                    let texte = await reponse.text();
                    if(texte.trim() !== "") { prenomSpectateur = texte.trim(); }
                }
            } catch (err) { }
        }

        // Le téléphone écoute le fichier texte toutes les secondes en arrière-plan
        setInterval(verifierFichierPrenom, 1000);

        function vibrer(duree) {
            if (navigator.vibrate) { navigator.vibrate(duree); }
            const hapticElement = document.getElementById('hapticSwitch');
            if (hapticElement) { hapticElement.checked = !hapticElement.checked; }
        }

        function parler(texte) {
            let parole = new SpeechSynthesisUtterance(texte);
            parole.lang = 'fr-CA'; // Accent Canadien-Français forcé
            parole.rate = 0.90;    // Rythme posé au téléphone
            window.speechSynthesis.speak(parole);
        }

        async function initialiserMicro() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                detecterBruitEnContinu();
            } catch (err) {
                alert("Microphone requis.");
            }
        }

        function detecterBruitEnContinu() {
            if (etape === 0 || etape >= 3) return;
            
            analyser.getByteFrequencyData(dataArray);
            let somme = 0;
            for (let i = 0; i < dataArray.length; i++) { somme += dataArray[i]; }
            let volumeMoyen = somme / dataArray.length / 255;

            if (volumeMoyen > SEUIL_BRUIT) {
                vibrer(80); 
                if (etape === 1) {
                    clearInterval(intervaleVibration);
                    etape = 2;
                    setTimeout(() => { lancerBoucleFamilles(); }, 1200); 
                } else if (etape === 2) {
                    clearInterval(intervaleVibration);
                    etape = 3;
                    executerDenouementVocal();
                }
            }
            if (etape < 3) { requestAnimationFrame(detecterBruitEnContinu); }
        }

        function demarrerTour() {
            if (etape > 0) return;
            document.getElementById('addCallBtn').style.opacity = "0.6";
            document.getElementById('statutAppel').innerText = "00:01"; 
            
            initialiserMicro().then(() => {
                etape = 1;
                let indexValeur = 0;
                valeurChoisie = valeurs[indexValeur];
                vibrer(150); 

                intervaleVibration = setInterval(() => {
                    indexValeur++;
                    if (indexValeur >= valeurs.length) indexValeur = 0;
                    valeurChoisie = valeurs[indexValeur];
                    vibrer(150); 
                }, 1000);
            });
        }

        function lancerBoucleFamilles() {
            if (etape !== 2) return;
            let indexFamille = 1;
            familleChoisie = familles[indexFamille.toString()];
            vibrer(150);

            intervaleVibration = setInterval(() => {
                indexFamille++;
                if (indexFamille > 4) indexFamille = 1;
                familleChoisie = familles[indexFamille.toString()];
                vibrer(150);
            }, 1000);
        }

        function executerDenouementVocal() {
            document.getElementById('statutAppel').innerText = "00:06";
            
            // Étape 1 : Salutation chaleureuse avec le prénom québécois
            parler(`Allô! Bonjour ${prenomSpectateur}!`);

            // Étape 2 : Pause dramatique d'hésitation (3.5 secondes)
            setTimeout(() => {
                parler("Attends un peu... Je ressens une drôle de connexion là...");
                
                // Étape 3 : Révélation finale de la carte
                setTimeout(() => {
                    parler(`La carte que tu as choisie... c'est le ${valeurChoisie} de ${familleChoisie}, c'est bien ça?`);
                }, 3000);

            }, 3500);
        }
    </script>
</body>
</html>
