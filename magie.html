<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call the Wizard - Simulateur iOS</title>
  <style>
    /* VARIABLES ET DESIGN SYSTEM DE L'INTERFACE */
    :root {
      --ios-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-gradient: linear-gradient(to bottom, #4a69ad 0%, #293d6d 50%, #152042 100%);
      --translucent-white: rgba(255, 255, 255, 0.2);
      --translucent-dark: rgba(25, 41, 82, 0.6);
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      font-family: var(--ios-font);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* CONTENEUR SIMULATEUR IPHONE */
    .phone-container {
      width: 375px;
      height: 812px;
      background: var(--bg-gradient);
      color: var(--text-white);
      position: relative;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* BARRE DE STATUT SUPÉRIEURE */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 4px 24px;
      font-size: 14px;
      font-weight: 500;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 📌 STYLE REQUIS : VERSION EN HAUT À GAUCHE */
    .app-version {
      position: absolute;
      top: 55px;
      left: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: bold;
      z-index: 999;
    }

    /* BARRE D'ACTION INFÉRIEURE AVEC FLÈCHE DE RETOUR */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
    }
    .back-arrow {
      font-size: 24px;
      cursor: pointer;
    }
    .modifier-btn {
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 16px;
      cursor: pointer;
    }

    /* ÉCRAN DE LA FICHE DU CONTACT (FICHE PRINCIPALE) */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      height: calc(100% - 100px);
    }

    /* AVATAR DE LA PIEUVRE ROUGE */
    .avatar-container {
      margin-top: 10px;
      width: 150px;
      height: 150px;
      position: relative;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* BLOC NOM ET PRÉNOM */
    .contact-name {
      font-size: 32px;
      font-weight: 600;
      text-align: center;
      margin: 20px 0;
      line-height: 1.2;
    }

    /* GRILLE DES 4 BOUTONS RONDS */
    .action-grid {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 280px;
      margin-bottom: 30px;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .circle-btn {
      width: 48px;
      height: 48px;
      background-color: var(--translucent-white);
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-white);
      transition: background 0.2s;
    }
    .circle-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    /* SECTION INFÉRIEURE : BANDEAU PHOTO ET AFFICHE */
    .info-row {
      width: 100%;
      background-color: var(--translucent-dark);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    .chevron-right {
      color: var(--text-muted);
    }

    /* BLOC DES COORDONNÉES INFÉRIEURES */
    .details-box {
      width: 100%;
      background-color: var(--translucent-dark);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .label-type {
      font-size: 13px;
      color: var(--text-muted);
    }
    .phone-number {
      font-size: 16px;
      font-weight: 500;
    }

    /* BARRE DE NAVIGATION COMMUNE (ONGLETS DU BAS) */
    .tab-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 65px;
      background-color: rgba(20, 30, 60, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-item.active {
      color: #38761d; /* Accentuation verte simulée */
    }

    /* ÉCRAN D'APPEL ACTIF (LE WIZARD) */
    #screen-calling {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-gradient);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
    }
    .calling-status {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .calling-name {
      font-size: 36px;
      font-weight: 500;
      margin-bottom: 40px;
    }
    .calling-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 80%;
      margin-top: auto;
      margin-bottom: 60px;
    }
    .call-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .btn-hangup {
      background-color: #ff3b30;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    
    <!-- 🛜 BARRE DE STATUT DU HAUT -->
    <div class="status-bar">
      <div class="status-left">
        <span>Videotron</span>
      </div>
      <div class="status-center">09:07</div>
      <div class="status-right">98 %</div>
    </div>

    <!-- 🏷️ TEXTE DE VERSION EN HAUT À GAUCHE (SOUS L'OPÉRATEUR) -->
    <div class="app-version">v1.4.2</div>

    <!-- ================= ÉCRAN 1 : FICHE DE CONTACT ================= -->
    <div id="screen-contact-view">
      <div class="nav-bar">
        <div class="back-arrow">&lt;</div>
        <button class="modifier-btn">Modifier</button>
      </div>

      <div class="screen">
        <!-- Conteneur central contenant l'image de la pieuvre -->
        <div class="avatar-container">
          <img class="avatar-img" src="https://squarespace-cdn.com" alt="Pieuvre Animoji" onerror="this.src='https://stickpng.com'">
        </div>

        <div class="contact-name">
          Nathalie<br>Rousseau
        </div>

        <!-- 4 boutons circulaires sous le contact -->
        <div class="action-grid">
          <div class="action-item">
            <button class="circle-btn">💬</button>
          </div>
          <!-- 📞 Bouton d'appel déclenchant "Call the Wizard" -->
          <div class="action-item" onclick="lancerAppelWizard()">
            <button class="circle-btn">📞</button>
          </div>
          <div class="action-item">
            <button class="circle-btn">📹</button>
          </div>
          <div class="action-item">
            <button class="circle-btn">✉️</button>
          </div>
        </div>

        <!-- Section Photo et affiche -->
        <div class="info-row">
          <div class="info-left">
            <img class="mini-avatar" src="https://stickpng.com" alt="mini-avatar">
            <span>Photo et affiche de contact</span>
          </div>
          <span class="chevron-right">&gt;</span>
        </div>

        <!-- Bloc du numéro -->
        <div class="details-box">
          <span class="label-type">cellulaire</span>
          <span class="phone-number">514 555-0199</span>
        </div>
      </div>

      <!-- Barre de navigation des onglets -->
      <div class="tab-bar">
        <div class="tab-item"><span>🕒</span><span>Récents</span></div>
        <div class="tab-item active"><span>👤</span><span>Contacts</span></div>
        <div class="tab-item"><span>⌨️</span><span>Clavier</span></div>
      </div>
    </div>

    <!-- ================= ÉCRAN 2 : MODE APPEL EN COURS (WIZARD) ================= -->
    <div id="screen-calling" style="display: none;">
      <div class="calling-status">Appel cellulaire en cours...</div>
      <div class="calling-name">Nathalie</div>
      
      <!-- Grille des fonctions d'appel standard iOS -->
      <div class="calling-grid">
        <div class="call-btn-container"><button class="circle-btn">🔇</button><span>silence</span></div>
        <div class="call-btn-container"><button class="circle-btn">⌨️</button><span>clavier</span></div>
        <div class="call-btn-container"><button class="circle-btn">🔊</button><span>haut-parleur</span></div>
        <div class="call-btn-container"><button class="circle-btn">➕</button><span>nouvel appel</span></div>
        <div class="call-btn-container"><button class="circle-btn">📹</button><span>FaceTime</span></div>
        <div class="call-btn-container"><button class="circle-btn">👤</button><span>contacts</span></div>
      </div>

      <!-- Bouton Raccrocher rouge tout en bas -->
      <div style="margin-bottom: 80px;" onclick="raccrocherAppel()">
