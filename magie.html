<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call the Wizard - Version Automatique</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh; /* tient compte de la barre d'adresse sur téléphone */
      overflow: hidden;
    }

    /* Le téléphone garde le format 375 x 812 et s'adapte à l'écran disponible */
    .phone-container {
      width: min(100vw, calc(100vh * 750 / 1334));
      width: min(100vw, calc(100dvh * 750 / 1334));
      aspect-ratio: 750 / 1334;
      background: #1a1a1a url('fond-iphone.png') center / 100% 100% no-repeat;
      position: relative;
      overflow: hidden;
    }

    /* Cadre arrondi seulement sur grand écran (ordinateur) */
    @media (min-width: 500px) {
      .phone-container {
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }
    }

    /* VERSION EN HAUT À GAUCHE (SOUS L'OPÉRATEUR) */
    .app-version {
      position: absolute;
      top: 4.4%;
      left: 2.5%;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: bold;
      z-index: 999;
      font-family: monospace;
    }

    /* ZONE CLIQUABLE INVISIBLE SUR LE BOUTON D'APPEL (positions en pourcentage) */
    .invisible-call-trigger {
      position: absolute;
      top: 58.4%;   /* 779 / 1334 */
      left: 31.4%;  /* 236 / 750 */
      width: 16.8%; /* 126 / 750 */
      height: 9.4%;  /* 126 / 1334 */
      border-radius: 50%;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0);
    }

    /* Ajoutez ?debug à l'adresse de la page pour voir la zone cliquable en rouge */
    .invisible-call-trigger.debug {
      background-color: rgba(255, 0, 0, 0.45);
    }

    /* Message d'erreur si l'image de fond est introuvable */
    #erreur-image {
      display: none;
      position: absolute;
      top: 12%;
      left: 5%;
      right: 5%;
      padding: 10px;
      background: #c0392b;
      color: #fff;
      font-size: 13px;
      border-radius: 8px;
      z-index: 2000;
      text-align: center;
    }

    /* CALQUE DU MODE APPEL */
    #layer-calling {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(20, 35, 75, 0.85);
      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 7%;
    }

    .calling-status {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 5px;
    }

    .calling-name {
      color: #ffffff;
      font-size: 36px;
      font-weight: 500;
      margin-bottom: 40px;
    }

    .calling-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 80%;
      margin-top: auto;
      margin-bottom: 60px;
    }

    .call-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 12px;
    }

    .circle-btn {
      width: 55px;
      height: 55px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .btn-hangup {
      background-color: #ff3b30;
    }
  </style>
</head>
<body>

  <div class="phone-container">

    <div class="app-version" id="version-lbl">v1.0.0000</div>

    <div id="erreur-image">⚠️ Image « fond-iphone.png » introuvable. Vérifiez qu'elle est dans le même dossier que cette page, avec exactement le même nom.</div>

    <!-- Zone invisible cliquable sur le bouton appel de votre photo -->
    <div class="invisible-call-trigger" id="trigger" onclick="lancerAppelWizard()"></div>

    <!-- CALQUE APPEL -->
    <div id="layer-calling" style="display: none;">
      <div class="calling-status">Appel cellulaire en cours...</div>
      <div class="calling-name">Nathalie</div>

      <div class="calling-grid">
        <div class="call-btn-container"><button class="circle-btn">🔇</button><span>silence</span></div>
        <div class="call-btn-container"><button class="circle-btn">⌨️</button><span>clavier</span></div>
        <div class="call-btn-container"><button class="circle-btn">🔊</button><span>haut-parleur</span></div>
        <div class="call-btn-container"><button class="circle-btn">➕</button><span>nouvel appel</span></div>
        <div class="call-btn-container"><button class="circle-btn">📹</button><span>FaceTime</span></div>
        <div class="call-btn-container"><button class="circle-btn">👤</button><span>contacts</span></div>
      </div>

      <div style="margin-bottom: 80px;" onclick="raccrocherAppel()">
        <button class="circle-btn btn-hangup">🔴</button>
      </div>
    </div>

  </div>

  <script>
    // La version = date et heure du dernier "Commit changes" de CETTE page sur GitHub
    // Format : v1.JJ.HHMM (exemple : v1.21.1045 = modifiée le 21 à 10h45)
    function formaterVersion(date) {
      let jour = String(date.getDate()).padStart(2, '0');
      let heures = String(date.getHours()).padStart(2, '0');
      let minutes = String(date.getMinutes()).padStart(2, '0');
      return "v1." + jour + "." + heures + minutes;
    }

    async function calculerVersionMinutes() {
      const lbl = document.getElementById('version-lbl');
      const nomPage = location.pathname.split('/').pop() || 'index.html';
      const url = "https://api.github.com/repos/bernardmichel777-max/mcberman/commits?per_page=1&path=" + encodeURIComponent(nomPage);
      try {
        const rep = await fetch(url);
        if (!rep.ok) throw new Error("GitHub " + rep.status);
        const data = await rep.json();
        const v = formaterVersion(new Date(data[0].commit.committer.date));
        lbl.innerText = v;
        try { localStorage.setItem('versionWizard', v); } catch (e) {}
      } catch (err) {
        // Sans internet : on garde la dernière version connue
        let v = null;
        try { v = localStorage.getItem('versionWizard'); } catch (e) {}
        lbl.innerText = v || "v1.??.????";
      }
    }

    function lancerAppelWizard() {
      document.getElementById('layer-calling').style.display = 'flex';
    }

    function raccrocherAppel() {
      document.getElementById('layer-calling').style.display = 'none';
    }

    // Vérifie que l'image de fond existe, sinon affiche un message clair
    function verifierImageFond() {
      const img = new Image();
      img.onerror = function () {
        document.getElementById('erreur-image').style.display = 'block';
      };
      img.src = 'fond-iphone.png';
    }

    // Mode debug : ajouter ?debug à l'adresse pour voir la zone cliquable
    if (location.search.indexOf('debug') !== -1) {
      document.getElementById('trigger').classList.add('debug');
    }

    window.onload = function () {
      calculerVersionMinutes();
      verifierImageFond();
    };
  </script>

</body>
</html>
