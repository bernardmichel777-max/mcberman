<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call the Wizard - Simulateur iOS Complet</title>
  <style>
    /* ==========================================
       1. VARIABLES ET CONFIGURATION DE BASE (iOS)
       ========================================== */
    :root {
      --ios-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --translucent-white: rgba(255, 255, 255, 0.2);
      --translucent-dark: rgba(25, 41, 82, 0.6);
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --ios-red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1c1c1e;
      font-family: var(--ios-font);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================
       2. CONTENEUR MAÎTRE DU TÉLÉPHONE
       ========================================== */
    .phone-container {
      width: 375px;
      height: 812px;
      background-image: url('fond-iphone.png');
      background-size: cover;
      background-position: center;
      position: relative;
      border-radius: 45px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      border: 4px solid #3a3a3c;
    }

    /* ==========================================
       3. BARRE DE STATUT SUPÉRIEURE (iOS)
       ========================================== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 4px 24px;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      z-index: 10;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ==========================================
       4. AFFICHAGE DU NUMÉRO DE VERSION
       ========================================== */
    .app-version {
      position: absolute;
      top: 52px;
      left: 24px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      background-color: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 100;
      letter-spacing: 0.5px;
    }

    /* ==========================================
       5. EN-TÊTE DE NAVIGATION (Retour / Modifier)
       ========================================== */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      position: relative;
      z-index: 10;
    }

    .back-arrow {
      font-size: 22px;
      font-weight: 300;
      color: var(--text-white);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .modifier-btn {
      background: none;
      border: none;
      color: var(--text-white);
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
    }

    /* ==========================================
       6. ZONE CENTRALE DE LA FICHE CONTACT
       ========================================== */
    .screen-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      height: calc(100% - 110px);
    }

    /* Espace invisible pour respecter la place de la pieuvre du fond */
    .avatar-spacer {
      height: 160px;
      width: 100%;
    }

    .contact-name {
      font-size: 34px;
      font-weight: 700;
      text-align: center;
      margin-top: 15px;
      margin-bottom: 25px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    /* ==========================================
       7. GRILLE DES BOUTONS DE COMMANDE RONDS
       ========================================== */
    .action-grid {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 290px;
      margin-bottom: 35px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .circle-btn {
      width: 52px;
      height: 52px;
      background-color: var(--translucent-white);
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-white);
      font-size: 20px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .circle-btn:active {
      transform: scale(0.95);
      background-color: rgba(255, 255, 255, 0.3);
    }

    .action-label {
      font-size: 11px;
      color: var(--text-white);
      font-weight: 400;
    }

    /* ==========================================
       8. SECTION CONTENEURS TEXTE (INFOS)
       ========================================== */
    .info-row {
      width: 100%;
      background-color: var(--translucent-dark);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      cursor: pointer;
      backdrop-filter: blur(20px);
    }

    .info-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 400;
    }

    .chevron-right {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 16px;
    }

    .details-box {
      width: 100%;
      background-color: var(--translucent-dark);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(20px);
    }

    .label-type {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: lowercase;
    }

    .phone-number {
      font-size: 17px;
      font-weight: 500;
      color: #2f80ed; /* Couleur iOS pour les numéros cliquables */
    }

    /* ==========================================
       9. BARRE D'ONGLETS DU BAS (TAB BAR)
       ========================================== */
    .tab-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 75px;
      background-color: rgba(15, 25, 50, 0.9);
      backdrop-filter: blur(25px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      width: 60px;
    }

    .tab-item.active {
      color: #2f80ed;
    }

    .tab-icon {
      font-size: 22px;
    }

    /* ==========================================
       10. MODE : INTERFACE APPEL EN COURS (WIZARD)
       ========================================== */
    #screen-calling {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #1a2a4e 0%, #0d1527 100%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 55px;
    }

    .calling-status {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 6px;
      animation: pulse 2s infinite;
    }

    .calling-name {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 50px;
    }

    .calling-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      width: 85%;
      margin-top: auto;
      margin-bottom: 50px;
    }

    .call-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-white);
    }

    .call-btn-container .circle-btn {
      width: 64px;
      height: 64px;
      font-size: 24px;
      background-color: rgba(255, 255, 255, 0.15);
    }

    .call-btn-container .circle-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
    }

    .btn-hangup {
      background-color: var(--ios-red) !important;
      width: 68px !important;
      height: 68px !important;
      font-size: 28px !important;
    }

    .hangup-container {
      margin-bottom: 75px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    /* Petites animations */
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    
    <!-- 🛜 BARRE DE STATUT SYSTEME -->
    <div class="status-bar">
      <div class="status-left">
        <span>Videotron</span>
      </div>
      <div class="status-center">09:07</div>
      <div class="status-right">
        <span>98 %</span>
      </div>
    </div>

    <!-- 🏷️ NOTRE NUMÉRO DE VERSION (HAUT GAUCHE) -->
    <div class="app-version" id="version-lbl">v1.4.2</div>

    <!-- ==========================================
         ÉCRAN 1 : VUE DE LA FICHE DU CONTACT
         ========================================== -->
    <div id="screen-contact-view">
      
      <!-- Barre d'outils iOS -->
      <div class="nav-bar">
        <div class="back-arrow">&lt;</div>
        <button class="modifier-btn">Modifier</button>
      </div>

      <!-- Corps de la fiche -->
      <div class="screen-content">
        
        <!-- Espace pour laisser voir la pieuvre de votre photo -->
        <div class="avatar-spacer"></div>

        <!-- Nom du contact -->
        <div class="contact-name">
          Nathalie<br>Rousseau
        </div>

        <!-- Les 4 boutons d'action circulaires -->
        <div class="action-grid">
          <div class="action-item">
